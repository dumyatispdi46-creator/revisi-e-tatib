<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8"><base target="_top"><title>Tatib SMAN 1 Pronojiwo</title>
<style>
:root{--b:#0b5cab;--bd:#083f78;--bl:#e8f2fc;--g:#f5b301;--ok:#169c5b;--er:#d64545;--t:#1d2b3a}
*{box-sizing:border-box}body{margin:0;font:14px/1.45 system-ui,Segoe UI,Roboto,sans-serif;color:var(--t);background:#f1f6fb}
button,input,select,textarea{font:inherit}input,select,textarea{border:1px solid #b9cde3;border-radius:8px;padding:8px 10px;background:#fff;max-width:100%}
button{border:0;border-radius:8px;padding:8px 14px;cursor:pointer;background:var(--bl);color:var(--bd);font-weight:600}
button.pri{background:var(--b);color:#fff}button.gold{background:var(--g);color:#3a2a00}button.red{background:var(--er);color:#fff}button:hover{filter:brightness(.95)}
#login{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,var(--bd),var(--b) 60%,#2e8be0)}
.lc{background:#fff;border-radius:18px;padding:30px;width:340px;text-align:center;box-shadow:0 20px 50px #0004;border-top:6px solid var(--g)}
.lc img{width:110px}.lc h1{font-size:18px;margin:8px 0 2px;color:var(--bd)}.lc p{margin:0 0 14px;color:#667}.lc input{width:100%;margin:5px 0}
#app{display:none}header{background:linear-gradient(90deg,var(--bd),var(--b));color:#fff;display:flex;align-items:center;gap:12px;padding:8px 16px;position:sticky;top:0;z-index:5;border-bottom:3px solid var(--g)}
header img{width:42px}header .tt{flex:1;line-height:1.2}header b{font-size:16px}header small{opacity:.85}header button{background:#ffffff26;color:#fff}
.chip{display:inline-block;background:var(--g);color:#3a2a00;border-radius:20px;padding:1px 9px;font-size:12px;font-weight:700}
.wrap{display:block}nav{display:none;position:fixed;top:64px;left:10px;width:250px;max-height:calc(100vh - 80px);overflow:auto;background:#fff;padding:10px;border-radius:14px;border-top:4px solid var(--g);box-shadow:0 12px 35px #0004;z-index:15}nav.open{display:block}
nav button{display:block;width:100%;text-align:left;margin:3px 0;background:none}nav button.on{background:var(--b);color:#fff}
main{flex:1;padding:18px;min-width:0}h2{margin:0 0 12px;color:var(--bd)}h3{margin:0 0 8px;font-size:15px}
.card{background:#fff;border-radius:12px;padding:14px;margin-bottom:14px;box-shadow:0 2px 8px #0b5cab14;border-left:4px solid var(--b)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:flex-end;margin-bottom:8px}.grow{flex:1}
label.f{display:flex;flex-direction:column;font-size:12px;color:#556;gap:3px}
.list{max-height:300px;overflow:auto;border:1px solid #dbe7f3;border-radius:8px}.it{display:flex;gap:8px;padding:6px 10px;border-bottom:1px solid #eef3f9;cursor:pointer;align-items:center}.it:hover{background:var(--bl)}.it small{color:#778;margin-left:auto}
.tw{overflow:auto}table{border-collapse:collapse;width:100%;background:#fff}th{background:var(--b);color:#fff;text-align:left;padding:8px;position:sticky;top:0}td{padding:7px 8px;border-bottom:1px solid #e5eef7}
tr.k{cursor:pointer}tr.k:hover td{background:var(--bl)}.nm{color:var(--b);font-weight:600;text-decoration:underline}.stat{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.stat div{background:#fff;border-radius:10px;padding:10px 16px;border-bottom:3px solid var(--g)}.stat b{font-size:20px;color:var(--b);display:block}
#mo{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:20;padding:12px}#mo>div{background:#fff;border-radius:14px;padding:18px;max-width:820px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;right:18px;z-index:30;padding:10px 16px;border-radius:10px;color:#fff;display:none;font-weight:600;box-shadow:0 6px 20px #0005}
.sp{display:inline-block;width:12px;height:12px;border:2px solid #fff;border-top-color:transparent;border-radius:50%;animation:r .7s linear infinite;vertical-align:-2px;margin-right:6px}@keyframes r{to{transform:rotate(360deg)}}
.star{color:var(--g);font-size:16px}
@media(max-width:800px){.grid2{grid-template-columns:1fr}}
</style></head><body>

<button class="pri" style="width:100%">Masuk</button></form></div>

const tl=p=>p<10?'-':p<=35?'Peringatan I (Petugas Ketertiban)':p<=55?'Peringatan II (Pembinaan Wali Kelas)':p<=75?'Panggilan Ortu I (Wali Kelas)':p<=95?'Panggilan Ortu II (Guru BK)':p<=149?'Panggilan Ortu III (Koord. BK)':p<500?'P3S '+Math.floor(p/50)+' hari (Wakasek Kesiswaan)':'Evaluasi Puncak (Kepala Sekolah)';
const agg=rows=>{const m={};rows.forEach(c=>{const x=m[c.nis]||(m[c.nis]={nis:c.nis,nama:c.nama,kelas:c.kelas,n:0,p:0});x.n++;x.p+=+c.poin});return Object.values(m).sort((a,b)=>b.p-a.p||a.nama.localeCompare(b.nama))};
async function pgRekap(j){const r=await call('catatan',{},'Memuat rekap…');if(!r)return;S.cat=r.rows;const P=j=='Pelanggaran',pr=[...new Set(S.cat.map(c=>c.periode))];
 $('#main').innerHTML=`<h2>Rekap ${P?'Pelanggaran':'Bintang Penghargaan'}</h2><div class="card"><div class="row">
 <label class="f">Kelas<select id="rk">${kOpt(1)}</select></label><label class="f">Dari<input type="date" id="rf"></label><label class="f">Sampai<input type="date" id="rt"></label>
 <label class="f">Periode<select id="rpe"><option value="">Semua</option>${pr.map(x=>`<option>${esc(x)}</option>`).join('')}</select></label><label class="f grow">Cari nama<input id="rq"></label>

 const D=()=>{const rw=F(),A=agg(rw);$('#rs').innerHTML=`<div><b>${A.length}</b>Siswa</div><div><b>${rw.length}</b>Catatan</div><div><b>${rw.reduce((s,c)=>s+ +c.poin,0)}</b>${P?'Total poin':'Total poin bintang'}</div>`;

 [...'#rk,#rf,#rt,#rpe,#rq'.split(',')].forEach(s=>$(s).oninput=D);D();

  $('#mb').onclick=async e=>{const id=e.target.dataset.d;if(id&&confirm('Hapus catatan ini?')&&await call('delCatatan',{ids:[id]},'Sedang menghapus…')){closeM();pgRekap(j)}}};

const ST=['Belum Ditangani','Sedang Ditangani','Sudah Ditangani'],SC={'Belum Ditangani':'#d64545','Sedang Ditangani':'#e08a00','Sudah Ditangani':'#169c5b'};

async function pgPen(){const a=await call('catatan',{},'Memuat data…');if(!a)return;const b=await call('penanganan',{},'Memuat penanganan…');if(!b)return;S.cat=a.rows;S.pen=b.rows;

  const all=agg(S.cat.filter(c=>c.jenis=='Pelanggaran')).filter(x=>x.p>=10).map(x=>{const t=tk(x.p),r=S.pen.find(y=>y.nis==x.nis&&y.tahap==t);return{...x,t,r,st:r?r.status:ST[0]}});

 $('#nk').onchange=$('#ns').onchange=$('#nq').oninput=D;D();
 $('#nt').onclick=e=>{const b=e.target.closest('button');if(!b)return;const x=ROWS.find(r=>r.nis==b.dataset.n);if(b.dataset.a=='j')return showPerj(x);

  $('#mk').onclick=async()=>{if(await call('savePenanganan',{nis:x.nis,nama:x.nama,kelas:x.kelas,tahap:x.t,poin:x.p,status:$('#ms').value,tanggal:$('#md').value||today(),catatan:$('#mc').value.trim()})){closeM();pgPen()}}}}

  $('#ms').onclick=async()=>{if(!$('#mn').value.trim())return toast('Nama wajib diisi','e');if(await call('savePoin',{id,jenis:$('#mj').value,nama:$('#mn').value.trim(),poin:$('#mp').value})){closeM();await refresh();pgPoin()}}};
 $('#pn').onclick=()=>ed('');
 $('#pr').onclick=async()=>{if(confirm('Ganti SELURUH daftar poin dengan daftar resmi Tatib SMANPRO 2026? Riwayat catatan yang sudah ada tidak berubah.')&&await call('resetPoin',{},'Sedang mengatur ulang…')){await refresh();pgPoin()}};
 $('#main').onclick=async e=>{const t=e.target.dataset;if(t.e)ed(t.e);if(t.x&&confirm('Hapus poin ini?')&&await call('delPoin',{ids:[t.x]},'Sedang menghapus…')){await refresh();pgPoin()}};
 $('#pd').onclick=async()=>{const ids=[...document.querySelectorAll('.pc:checked')].map(c=>c.value);if(!ids.length)return toast('Belum ada yang dipilih','e');if(confirm('Hapus '+ids.length+' poin terpilih?')&&await call('delPoin',{ids},'Sedang menghapus…')){await refresh();pgPoin()}}}
async function refresh(){const r=await call('boot',{},'Memuat ulang…');if(r){Object.assign(S,r);S.kelas=[...new Set(S.siswa.map(s=>s.kelas))].sort((a,b)=>kn(a)-kn(b))}}
// ---------- siswa
function pgSiswa(){const k=window._sk??S.kelas[0],q=(window._sq||'').toLowerCase(),L=S.siswa.filter(s=>(!k||s.kelas==k)&&s.nama.toLowerCase().includes(q)).sort((a,b)=>a.nama.localeCompare(b.nama));
 $('#main').innerHTML=`<h2>Data Siswa</h2><div class="card"><div class="row"><select id="sk">${kOpt(1)}</select><input id="sq" placeholder="Cari nama" value="${esc(window._sq||'')}"><button class="pri" id="sn">+ Tambah Siswa</button><button class="red" id="sd">Hapus terpilih</button><span class="chip">${L.length} siswa</span></div>
 <div class="tw"><table><tr><th><input type="checkbox" id="sa"></th><th>NISN</th><th>Nama</th><th>JK</th><th>Kelas</th><th></th></tr>`+L.slice(0,200).map(s=>`<tr><td><input type="checkbox" class="sc" value="${s.nis}"></td><td>${s.nis}</td><td>${esc(s.nama)}</td><td>${s.jk}</td><td>${s.kelas}</td><td><button data-e="${s.nis}">Edit</button> <button class="red" data-x="${s.nis}">Hapus</button></td></tr>`).join('')+'</table></div></div>';
 $('#sk').value=k;$('#sk').onchange=e=>{window._sk=e.target.value;pgSiswa()};$('#sq').onchange=e=>{window._sq=e.target.value;pgSiswa()};$('#sa').onchange=e=>document.querySelectorAll('.sc').forEach(c=>c.checked=e.target.checked);
 const ed=old=>{const s=S.siswa.find(x=>x.nis==old)||{nis:'',nama:'',jk:'L',kelas:k||S.kelas[0]};modal(`<h3>${old?'Edit':'Tambah'} Siswa</h3><div class="row"><label class="f">NISN<input id="mi" value="${s.nis}"></label><label class="f grow">Nama<input id="mn" value="${esc(s.nama)}"></label><label class="f">JK<select id="mj"><option ${s.jk=='L'?'selected':''}>L</option><option ${s.jk=='P'?'selected':''}>P</option></select></label><label class="f">Kelas<select id="mk">${kOpt()}</select></label></div><button class="pri" id="ms">Simpan</button> <button onclick="closeM()">Batal</button>`);$('#mk').value=s.kelas;
  $('#ms').onclick=async()=>{if(!$('#mi').value.trim()||!$('#mn').value.trim())return toast('NISN dan nama wajib diisi','e');if(await call('saveSiswa',{old,nis:$('#mi').value.trim(),nama:$('#mn').value.trim(),jk:$('#mj').value,kelas:$('#mk').value})){closeM();await refresh();pgSiswa()}}};
 $('#sn').onclick=()=>ed('');
 $('#main').onclick=async e=>{const t=e.target.dataset;if(t.e)ed(t.e);if(t.x&&confirm('Hapus siswa ini?')&&await call('delSiswa',{nis:[t.x]},'Sedang menghapus…')){await refresh();pgSiswa()}};
 $('#sd').onclick=async()=>{const n=[...document.querySelectorAll('.sc:checked')].map(c=>c.value);if(!n.length)return toast('Belum ada yang dipilih','e');if(confirm('Hapus '+n.length+' siswa?')&&await call('delSiswa',{nis:n},'Sedang menghapus…')){await refresh();pgSiswa()}}}
// ---------- akun
async function pgAkun(){const r=await call('users',{},'Memuat akun…');if(!r)return;
 $('#main').innerHTML=`<h2>Pengaturan Akun</h2><div class="card"><p style="margin-top:0;color:#556">Hak akses: <b>Admin</b> penuh · <b>Staff TU</b> input, rekap &amp; data siswa · <b>Wali Kelas</b> input semua kelas, rekap kelas sendiri · <b>Kepala Sekolah, Guru, Waka Humas/Sarpras/Kurikulum</b> input &amp; rekap semua kelas.</p><button class="pri" id="an">+ Tambah Akun / Admin</button>
 <div class="tw"><table><tr><th>Username</th><th>Nama</th><th>NIP</th><th>Peran</th><th>Kelas</th><th>Status</th><th></th></tr>`+r.rows.map(u=>`<tr><td>${esc(u.username)}</td><td>${esc(u.nama)}</td><td>${esc(u.nip)}</td><td>${RL[u.role]}</td><td>${u.kelas}</td><td>${u.aktif=='Y'?'Aktif':'Nonaktif'}</td><td><button data-e="${esc(u.username)}">Edit</button> <button class="red" data-x="${esc(u.username)}">Hapus</button></td></tr>`).join('')+'</table></div></div>';
 const ed=un=>{const u=r.rows.find(x=>x.username==un)||{username:'',nama:'',nip:'',role:'guru',kelas:S.kelas[0],aktif:'Y'};
  modal(`<h3>${un?'Edit':'Tambah'} Akun</h3><div class="row"><label class="f">Username<input id="au" value="${esc(u.username)}" ${un?'disabled':''}></label><label class="f">Password ${un?'(kosong = tidak diubah)':''}<input id="ap" type="text"></label></div><div class="row"><label class="f grow">Nama lengkap<input id="an2" value="${esc(u.nama)}"></label><label class="f">NIP<input id="ai" value="${esc(u.nip)}"></label></div>
  <div class="row"><label class="f">Peran<select id="ar">${Object.keys(RL).map(k=>`<option value="${k}" ${u.role==k?'selected':''}>${RL[k]}</option>`).join('')}</select></label><label class="f">Kelas (wali kelas)<select id="ak2">${kOpt()}</select></label><label class="f">Status<select id="as"><option value="Y" ${u.aktif=='Y'?'selected':''}>Aktif</option><option value="N" ${u.aktif!='Y'?'selected':''}>Nonaktif</option></select></label></div><button class="pri" id="ms">Simpan</button> <button onclick="closeM()">Batal</button>`);$('#ak2').value=u.kelas||S.kelas[0];
  $('#ms').onclick=async()=>{const d={isNew:!un,username:$('#au').value.trim(),password:$('#ap').value,nama:$('#an2').value.trim(),nip:$('#ai').value.trim(),role:$('#ar').value,kelas:$('#ak2').value,aktif:$('#as').value};if(!d.username||!d.nama)return toast('Username dan nama wajib diisi','e');if(await call('saveUser',d)){closeM();pgAkun()}}};
 $('#an').onclick=()=>ed('');$('#main').onclick=async e=>{const t=e.target.dataset;if(t.e)ed(t.e);if(t.x&&confirm('Hapus akun '+t.x+'?')&&await call('delUser',{username:t.x},'Sedang menghapus…'))pgAkun()}}
// ---------- periode & hapus
function pgPer(){const y=new Date().getFullYear();$('#main').innerHTML=`<h2>Pengaturan Periode</h2><div class="card"><div class="row"><label class="f">Tahun Ajaran<input id="pt" value="${esc(S.periode.tahun)}" placeholder="2026/2027"></label><label class="f">Semester<select id="ps"><option ${S.periode.semester=='Ganjil'?'selected':''}>Ganjil</option><option ${S.periode.semester=='Genap'?'selected':''}>Genap</option></select></label><button class="pri" id="pk">Simpan Periode</button></div><small>Catatan baru otomatis ditandai dengan periode aktif ini.</small></div>`;
 $('#pk').onclick=async()=>{const d={tahun:$('#pt').value.trim(),semester:$('#ps').value};if(!/^\d{4}\/\d{4}$/.test(d.tahun))return toast('Format tahun ajaran: 2026/2027','e');if(await call('setPeriode',d)){S.periode=d;$('#hp').textContent='Periode: '+d.tahun+' · Semester '+d.semester}}}
async function pgHapus(){const r=await call('catatan',{},'Memuat…');if(!r)return;const pr=[...new Set(r.rows.map(c=>c.periode))];
 $('#main').innerHTML=`<h2>Hapus Data Input</h2><div class="card"><p style="margin-top:0">Menghapus <b>catatan pelanggaran &amp; bintang</b> (data siswa, poin, dan akun tidak ikut terhapus). Tindakan ini tidak dapat dibatalkan.</p>
 <div class="row"><button class="red" data-s="w">Hapus data 7 hari terakhir</button><button class="red" data-s="m">Hapus data bulan ini</button></div><div class="row"><label class="f">Hapus per semester<select id="hs">${pr.map(x=>`<option>${esc(x)}</option>`).join('')||'<option value="">(belum ada data)</option>'}</select></label><button class="red" data-s="p">Hapus semester terpilih</button></div></div>`;
 $('#main').onclick=async e=>{const s=e.target.dataset.s;if(!s)return;const n=new Date(),iso=d=>new Date(d-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);let d={},lb;
  if(s=='w'){d={scope:'range',from:iso(new Date(n-6*864e5)),to:today()};lb='7 hari terakhir'}else if(s=='m'){d={scope:'range',from:iso(new Date(n.getFullYear(),n.getMonth(),1)),to:iso(new Date(n.getFullYear(),n.getMonth()+1,0))};lb='bulan ini'}else{d={scope:'periode',periode:$('#hs').value};lb='periode '+d.periode;if(!d.periode)return}
  if(!confirm('Yakin hapus seluruh data input '+lb+'?')||prompt('Ketik HAPUS untuk konfirmasi')!='HAPUS')return;const x=await call('hapusData',d,'Sedang menghapus data…');if(x){toast(x.n+' catatan dihapus','s');pgHapus()}}}
</script></body></html>
